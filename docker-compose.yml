services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: shield-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - shield-es-data:/usr/share/elasticsearch/data
    networks:
      - shield

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: shield-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - shield

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: shield-logstash
    volumes:
      - ./deployment/docker/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./deployment/docker/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
    networks:
      - shield

volumes:
  shield-es-data:

networks:
  shield:
    driver: bridge